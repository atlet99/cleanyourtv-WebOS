# Builds the documentation (https://zensical.org) on every change to it, and publishes it to GitHub Pages from main.
# Also publishes the Homebrew Channel repository feed (/repo/apps.json) from the latest release.
# GitHub Pages uses "GitHub Actions" as its source (repository Settings > Pages).
name: Documentation
on:
  workflow_call:
    secrets:
      CYTV_RELEASE_PUBLIC_KEY_PEM:
        required: false
  workflow_dispatch:
  push:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/make-repo-feed.py"
      - "tools/ipk_metadata.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "tools/make-repo-feed.py"
      - "tools/ipk_metadata.py"
      - ".github/workflows/docs.yml"
  release:
    types: [released]
permissions:
  contents: read
  pages: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event_name == 'release' || github.ref_name == github.event.repository.default_branch) && github.event.repository.default_branch || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'release')
        id: pages
      - run: python -m pip install zensical==0.0.71
      - run: zensical build --clean --strict
      # The Homebrew Channel feed under /repo/: the latest published release package at a stable URL,
      # so users can add one feed URL on the TV. Written after the zensical --clean so it survives.
      - name: Add the Homebrew Channel feed
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_KEY: ${{ secrets.CYTV_RELEASE_PUBLIC_KEY_PEM || vars.CYTV_RELEASE_PUBLIC_KEY_PEM }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName)
          if [ "$releases" = '[]' ]; then
            echo "No release published yet; the Homebrew Channel feed is skipped"
            exit 0
          fi
          if [ -z "$PUBLIC_KEY" ]; then
            echo 'A trusted CYTV_RELEASE_PUBLIC_KEY_PEM is required; refusing to publish an unchecked feed'
            exit 1
          fi
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          download=$(mktemp -d "$RUNNER_TEMP/pages-release.XXXXXX")
          trap 'rm -rf "$download"' EXIT
          printf '%s\n' "$PUBLIC_KEY" > "$download/public.pem"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$download" \
            --pattern 'com.cleanyourtv.manager_*_all.ipk' --pattern 'com.cleanyourtv.manager_*_all.ipk.sha256' \
            --pattern 'com.cleanyourtv.manager_*_all.ipk.sha256.sig'
          python3 tools/make-repo-feed.py build --dist "$download" --out site/repo \
            --base-url "$PAGES_BASE_URL/repo" --root "$PAGES_BASE_URL" \
            --source "https://github.com/$GITHUB_REPOSITORY" --public-key "$download/public.pem"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'release')
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || github.event_name == 'release')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
