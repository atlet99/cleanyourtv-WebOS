name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    name: Publish checked release
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      new_release_published: ${{ steps.publish.outputs.published }}
      new_release_version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Plan version and release notes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py plan --plan "$RUNNER_TEMP/release-plan.json"
      - name: Require both production signing keys
        if: steps.plan.outputs.publish == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.CYTV_RELEASE_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.CYTV_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          test -n "$PRIVATE_KEY" && test -n "$PUBLIC_KEY" || { echo 'Configure CYTV_RELEASE_PRIVATE_KEY and CYTV_RELEASE_PUBLIC_KEY_PEM; stable releases must be signed'; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.publish == 'true'
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install isolated packager
        if: steps.plan.outputs.publish == 'true'
        id: packager
        run: bash .github/actions/package-webos/setup.sh
      - name: Build and verify signed release packages
        if: steps.plan.outputs.publish == 'true'
        env:
          NODE_PATH: ${{ steps.packager.outputs.directory }}/node_modules
          CYTV_RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          CYTV_BUILD: ${{ github.sha }}
          PRIVATE_KEY: ${{ secrets.CYTV_RELEASE_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.CYTV_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/release-key.XXXXXX")
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$PRIVATE_KEY" > "$keydir/private.pem"
          printf '%s\n' "$PUBLIC_KEY" > "$RUNNER_TEMP/release-public.pem"
          CYTV_SIGNING_KEY="$keydir/private.pem" CYTV_RELEASE_PUBLIC_KEY="$RUNNER_TEMP/release-public.pem" python3 ipk/build.py
          (cd dist && sha256sum --check ./*.sha256)
      - name: Upload and publish only complete checked assets
        if: steps.plan.outputs.publish == 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py publish --plan "$RUNNER_TEMP/release-plan.json" --public-key "$RUNNER_TEMP/release-public.pem"
      - name: Remove isolated packager
        if: always() && steps.packager.outputs.directory != ''
        env:
          TOOLING_DIRECTORY: ${{ steps.packager.outputs.directory }}
        run: rm -rf -- "$TOOLING_DIRECTORY"
