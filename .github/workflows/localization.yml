name: Localization
on:
  push:
    paths:
      - "shared/i18n.js"
      - "app/index.html"
      - "manager/app/index.html"
      - "picker/app/index.html"
      - "notify/app/index.html"
      - "picker/app/**/appinfo.json"
      - "notify/app/**/appinfo.json"
      - "helper/*.js"
      - "themes/*.json"
      - "tools/i18n-*"
      - ".github/workflows/localization.yml"
  pull_request:
    paths:
      - "shared/i18n.js"
      - "app/index.html"
      - "manager/app/index.html"
      - "picker/app/index.html"
      - "notify/app/index.html"
      - "picker/app/**/appinfo.json"
      - "notify/app/**/appinfo.json"
      - "helper/*.js"
      - "themes/*.json"
      - "tools/i18n-*"
      - ".github/workflows/localization.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "8.12.0"
      - run: node tools/i18n-check.js
