name: Localization
on:
  push:
    paths:
      - "shared/i18n.js"
      - "app/index.html"
      - "manager/app/index.html"
      - "picker/app/index.html"
      - "notify/app/index.html"
      - "picker/app/**/appinfo.json"
      - "notify/app/**/appinfo.json"
      - "helper/*.js"
      - "themes/*.json"
      - "tools/i18n-*"
      - ".github/workflows/localization.yml"
  pull_request:
    paths:
      - "shared/i18n.js"
      - "app/index.html"
      - "manager/app/index.html"
      - "picker/app/index.html"
      - "notify/app/index.html"
      - "picker/app/**/appinfo.json"
      - "notify/app/**/appinfo.json"
      - "helper/*.js"
      - "themes/*.json"
      - "tools/i18n-*"
      - ".github/workflows/localization.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "8.12.0"
      - run: node tools/i18n-check.js
