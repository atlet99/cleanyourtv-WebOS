# Optional manually requested PRE-release named test-<branch>. Pull requests never publish releases.
# The manager app on the TV can be pointed at such a build (Update channel); "latest" and the stable updater never see it.
name: Test build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install isolated standalone packager
        id: packager
        run: bash .github/actions/package-webos/setup.sh
      - name: Service checks under Node 8.12.0 (what webOS 5 ships)
        run: sh tools/node8-check.sh
      - name: Check standalone packaging and legacy command
        env:
          NODE_PATH: ${{ steps.packager.outputs.directory }}/node_modules
        run: python3 .github/actions/package-webos/check.py
      - name: Build the package
        env:
          NODE_PATH: ${{ steps.packager.outputs.directory }}/node_modules
          CYTV_RELEASE_PRIVATE_KEY: ${{ secrets.CYTV_RELEASE_PRIVATE_KEY }}
          CYTV_RELEASE_PUBLIC_KEY_PEM: ${{ vars.CYTV_RELEASE_PUBLIC_KEY_PEM }}
        run: |
          test -n "$CYTV_RELEASE_PRIVATE_KEY" && test -n "$CYTV_RELEASE_PUBLIC_KEY_PEM" || { echo "Configure the release signing key and public key first"; exit 1; }
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          printf '%s\n' "$CYTV_RELEASE_PRIVATE_KEY" > "$keydir/private.pem"
          printf '%s\n' "$CYTV_RELEASE_PUBLIC_KEY_PEM" > "$keydir/public.pem"
          CYTV_BUILD="${GITHUB_SHA::7}" CYTV_SIGNING_KEY="$keydir/private.pem" CYTV_RELEASE_PUBLIC_KEY="$keydir/public.pem" python3 ipk/build.py
      - name: Publish the test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/--*/-/g; s/^-//; s/-$//' | cut -c1-60)
          [ -n "$slug" ] || { echo "branch name gives an empty tag"; exit 1; }
          tag="test-$slug"
          subject=$(git log -1 --format=%s)
          svc=$(sed -n "s/^const VERSION = '\(.*\)';/\1/p" helper/helper.js | head -1)
          printf 'build: %s\nbranch: %s\n\nTest build of the branch %s (service %s). Not a release: it is for people who are asked to try a change.\nLast commit: %s\n' \
            "${GITHUB_SHA::7}" "$GITHUB_REF_NAME" "$GITHUB_REF_NAME" "$svc" "$subject" > notes.txt
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Test build: $GITHUB_REF_NAME" --notes-file notes.txt dist/*
      - name: Remove isolated packager
        if: always() && steps.packager.outputs.directory != ''
        env:
          TOOLING_DIRECTORY: ${{ steps.packager.outputs.directory }}
        run: rm -rf -- "$TOOLING_DIRECTORY"
